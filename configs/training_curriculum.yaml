pipeline: score-first-piano-training-v1
dataset:
  core: PDMX
  filters: [no_license_conflict, all_valid, best_unique_arrangement, solo_piano, intermediate, tiered-quality-policy, 48-192-measures]
  genres: [classical-piano, etude, nocturne, waltz, prelude, minuet, impromptu, theme-and-variations]
  split_unit: normalized_work_id
representation:
  score_artifact: ScoreDSL-1.0
  model_target: ModelScoreDSL-compact-measure-interleaved-v3
  performance: PianoPerformanceIR-1.0
curriculum:
  - score-dsl-autoencode-16-measure-windows
  - section-expand-16-64-with-global-context
  - whole-piece-generate-48-192
  - masked-span-inpaint
  - ending-complete
  - recapitulation-revise
  - section-variation-revise
hardware:
  local: Apple-Silicon-development-and-rendering
  training: single-NVIDIA-48-80GB
trainer:
  adaptation: QLoRA-4bit-NF4
  tokenizer_strategy: reuse-upstream-bpe-for-pilot
  max_seq_length: 81920
  complete_piece_truncation: forbidden
  estimated_character_preflight_budget: 175000
